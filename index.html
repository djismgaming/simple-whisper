<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple-Whisper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Simple-Whisper</h1>
                <button type="button" id="settings-btn" class="settings-btn" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 512 512" fill="currentColor">
                        <path d="M495.9 166.6c3.2 8.7 .5 18.4-6.4 24.6l-43.3 39.4c1.1 8.3 1.7 16.8 1.7 25.4s-.6 17.1-1.7 25.4l43.3 39.4c6.9 6.2 9.6 15.9 6.4 24.6c-4.4 11.9-9.7 23.3-15.8 34.3l-4.7 8.1c-6.6 11-14 21.4-22.1 31.2c-5.9 7.2-15.7 9.6-24.5 6.8l-55.7-17.7c-13.4 10.3-28.2 18.9-44 25.4l-12.5 57.1c-2 9.1-9 16.3-18.2 17.8c-13.8 2.3-28 3.5-42.5 3.5s-28.7-1.2-42.5-3.5c-9.2-1.5-16.2-8.7-18.2-17.8l-12.5-57.1c-15.8-6.5-30.6-15.1-44-25.4L83.1 425.9c-8.8 2.8-18.6 .3-24.5-6.8c-8.1-9.8-15.5-20.2-22.1-31.2l-4.7-8.1c-6.1-11-11.4-22.4-15.8-34.3c-3.2-8.7-.5-18.4 6.4-24.6l43.3-39.4C64.6 273.1 64 264.6 64 256s.6-17.1 1.7-25.4L22.4 191.2c-6.9-6.2-9.6-15.9-6.4-24.6c4.4-11.9 9.7-23.3 15.8-34.3l4.7-8.1c6.6-11 14-21.4 22.1-31.2c5.9-7.2 15.7-9.6 24.5-6.8l55.7 17.7c13.4-10.3 28.2-18.9 44-25.4l12.5-57.1c2-9.1 9-16.3 18.2-17.8C227.3 1.2 241.5 0 256 0s28.7 1.2 42.5 3.5c9.2 1.5 16.2 8.7 18.2 17.8l12.5 57.1c15.8 6.5 30.6 15.1 44 25.4l55.7-17.7c8.8-2.8 18.6-.3 24.5 6.8c8.1 9.8 15.5 20.2 22.1 31.2l4.7 8.1c6.1 11 11.4 22.4 15.8 34.3zM256 336a80 80 0 1 0 0-160 80 80 0 1 0 0 160z"/>
                    </svg>
                </button>
            </div>
            
            <form id="transcription-form">
                <div class="form-group">
                    <label for="file-input">Upload Audio/Video File</label>
                    <input type="file" id="file-input" accept="audio/*,video/*" required>
                    <div class="file-info" id="file-info"></div>
                </div>
                
                <div class="form-group">
                    <label for="model-select">Model</label>
                    <select id="model-select"></select>
                </div>
                
                <button type="submit" id="submit-btn" disabled>
                    <span id="btn-text">Submit</span>
                    <span id="loading-spinner" class="spinner"></span>
                </button>
            </form>
            
            <div id="error-container" class="error-container"></div>
            
            <div id="result-container" class="result-container">
                <div class="result-header">
                    <h2>Transcription Result</h2>
                    <div class="result-actions">
                        <button id="clear-btn" class="clear-btn" disabled>Clear</button>
                        <button id="copy-btn" class="copy-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        Copy
                    </button>
                    </div>
                </div>
                <div id="result-text" class="result-text"></div>
                <div id="copy-success" class="copy-success"></div>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Model Settings</h2>
                <button type="button" id="close-settings" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="model-configs">
                    <div class="model-config" data-slot="1">
                        <div class="config-header">
                            <h3>Model Slot 1</h3>
                            <button type="button" class="restore-default-btn" data-slot="1">Restore whispercpp Default</button>
                        </div>
                        <div class="form-group">
                            <label for="model-name-1">Model Name</label>
                            <input type="text" id="model-name-1" placeholder="whispercpp">
                        </div>
                        <div class="form-group">
                            <label for="server-url-1">Server URL</label>
                            <input type="text" id="server-url-1" placeholder="http://localhost:8080/v1/audio/transcriptions">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="temperature-1">Temperature</label>
                                <input type="text" id="temperature-1" placeholder="0.0">
                            </div>
                            <div class="form-group">
                                <label for="temperature-inc-1">Temperature Inc</label>
                                <input type="text" id="temperature-inc-1" placeholder="0.2">
                            </div>
                        </div>
                    </div>
                    <div class="model-config" data-slot="2">
                        <div class="config-header">
                            <h3>Model Slot 2</h3>
                            <button type="button" class="restore-default-btn" data-slot="2">Restore whispercpp Default</button>
                        </div>
                        <div class="form-group">
                            <label for="model-name-2">Model Name</label>
                            <input type="text" id="model-name-2" placeholder="whispercpp1">
                        </div>
                        <div class="form-group">
                            <label for="server-url-2">Server URL</label>
                            <input type="text" id="server-url-2" placeholder="http://localhost:8080/v1/audio/transcriptions">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="temperature-2">Temperature</label>
                                <input type="text" id="temperature-2" placeholder="0.0">
                            </div>
                            <div class="form-group">
                                <label for="temperature-inc-2">Temperature Inc</label>
                                <input type="text" id="temperature-inc-2" placeholder="0.2">
                            </div>
                        </div>
                    </div>
                    <div class="model-config" data-slot="3">
                        <div class="config-header">
                            <h3>Model Slot 3</h3>
                            <button type="button" class="restore-default-btn" data-slot="3">Restore whispercpp Default</button>
                        </div>
                        <div class="form-group">
                            <label for="model-name-3">Model Name</label>
                            <input type="text" id="model-name-3" placeholder="whispercpp2">
                        </div>
                        <div class="form-group">
                            <label for="server-url-3">Server URL</label>
                            <input type="text" id="server-url-3" placeholder="http://localhost:8080/v1/audio/transcriptions">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="temperature-3">Temperature</label>
                                <input type="text" id="temperature-3" placeholder="0.0">
                            </div>
                            <div class="form-group">
                                <label for="temperature-inc-3">Temperature Inc</label>
                                <input type="text" id="temperature-inc-3" placeholder="0.2">
                            </div>
                        </div>
                    </div>
                </div>
                <div id="settings-error" class="error-container"></div>
                <div id="settings-success" class="copy-success"></div>
            </div>
            <div class="modal-footer">
                <button type="button" id="save-settings" class="save-btn">Save Settings</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
